name: LastSet integrity tests

on:
  push:
    branches: [main, v0129-trust-data-integrity, v0130-profile-equipment, v0.11-core-reliability, v0134-memory-mvp, v0135-precor-machine-library, v0136-canonical-machine-library, v0137-smarter-memory-progress, v0138-ios-safe-area, v0139-brand-nav-polish, v01310-personal-identity-polish, v0140-capture-progress-migration, v01402-voice-reliability, v0141-offline-muscle-explorer, v01411-webkit-offline-shell]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check lastset-integrity.js
          node --check lastset-profile-equipment.js
          node --check lastset-navigation.js
          node --check lastset-smartlog-shorthand.js
          node --check lastset-core-reliability.js
          node --check lastset-smartlog-p1.js
          node --check tests/p1-gym-language-smoke.js
          node --check lastset-memory.js
          node --check lastset-intelligence.js
          node --check lastset-beta.js
          node --check lastset-brand.js
          node --check lastset-identity.js
          node --check lastset-v0140.js
          node --check lastset-onboarding.js
          node --check lastset-offline.js
          node --check lastset-atlas-regions.js
          node --check lastset-anatomy.js
          node --check tests/anatomy-smoke.js
          node --check lastset-muscle-library.js
          node --check lastset-explore.js
          node --check lastset-diagnostics.js
          node --check lastset-mobility.js
          node --check tests/mobility-smoke.js
          node --check scripts/stamp-release.mjs
          node --check tests/diagnostics-smoke.js
          node --check tests/p0-data-trust-smoke.js
          node --check tests/p0-storage-save-smoke.js
          node --check tests/p0-registry-save-smoke.js
          node --check tests/p0-restore-smoke.js
          node --check tests/release-smoke.js
          node --check tests/e2e/lastset.production.spec.js
          node --check service-worker.js
          node --check worker.js
          bash -n build-cloudflare.sh
      - name: Integrity smoke tests
        run: node tests/integrity-smoke.js
      - name: Phase 0 data trust backup tests
        run: node tests/p0-data-trust-smoke.js
      - name: Phase 0 persistence failure tests
        run: node tests/p0-storage-save-smoke.js
      - name: Phase 0 profile registry failure tests
        run: node tests/p0-registry-save-smoke.js
      - name: Phase 0 backup recovery tests
        run: node tests/p0-restore-smoke.js
      - name: Profile and equipment smoke tests
        run: node tests/profile-equipment-smoke.js
      - name: Navigation smoke tests
        run: node tests/navigation-smoke.js
      - name: Smart Log shorthand smoke tests
        run: node tests/smartlog-shorthand-smoke.js
      - name: Core reliability smoke tests
        run: node tests/core-reliability-smoke.js
      - name: P1 living gym-language regression
        run: node tests/p1-gym-language-smoke.js
      - name: P1 source-boundary and invented-set regression
        run: node tests/p1-source-boundary-smoke.js
      - name: Memory smoke tests
        run: node tests/memory-smoke.js
      - name: Intelligence smoke tests
        run: node tests/intelligence-smoke.js
      - name: iOS safe area smoke tests
        run: node tests/ios-safe-area-smoke.js
      - name: Brand and navigation smoke tests
        run: node tests/brand-nav-smoke.js
      - name: Personal identity smoke tests
        run: node tests/identity-smoke.js
      - name: v0.14 feature smoke tests
        run: node tests/v0140-smoke.js
      - name: Onboarding smoke tests
        run: node tests/onboarding-smoke.js
      - name: Offline smoke tests
        run: node tests/offline-smoke.js
      - name: Muscle Explorer smoke tests
        run: node tests/explore-smoke.js
      - name: Muscle Explorer catalogue and side restrictions
        run: node tests/muscle-explorer-coverage.js
      - name: Mobility and hidden machine scan smoke tests
        run: node tests/mobility-smoke.js
      - name: Debug console smoke tests
        run: node tests/diagnostics-smoke.js
      - name: Release versioning smoke tests
        run: node tests/release-smoke.js
      - name: Premium anatomy smoke tests
        run: node tests/anatomy-smoke.js
      - name: Verify production bundle inputs
        run: |
          test -s lastset-integrity.js
          test -s lastset-profile-equipment.js
          test -s lastset-navigation.js
          test -s lastset-smartlog-shorthand.js
          test -s lastset-core-reliability.js
          test -s lastset-smartlog-p1.js
          test -s lastset-memory.js
          test -s lastset-intelligence.js
          test -s lastset-beta.js
          test -s lastset-brand.js
          test -s lastset-brand.css
          test -s lastset-identity.js
          test -s lastset-identity.css
          test -s lastset-v0140.js
          test -s lastset-v0140.css
          test -s lastset-onboarding.js
          test -s lastset-onboarding.css
          test -s lastset-offline.js
          test -s lastset-offline.css
          test -s lastset-atlas-regions.js
          test -s lastset-anatomy.js
          test -s lastset-anatomy.css
          test -s lastset-muscle-library.js
          test -s lastset-explore.js
          test -s lastset-diagnostics.js
          test -s lastset-mobility.js
          test -s lastset-mobility.css
          test -s lastset-diagnostics.css
          test -s scripts/stamp-release.mjs
          test -s lastset-explore.css
          test -s assets/lastset-mark.svg
          test -s apple-touch-icon.png
          test -s lastset-workouts.js
          test -s lastset-calendar.js
          test -s assets/home-hero-thiva.webp
          test -s V1_RELEASE_CHECKLIST.md
          test -s V1_BETA_RELEASE.md
          test -s V2_BACKLOG.md
          grep -q 'lastset-integrity.js' worker.js
          grep -q 'lastset-profile-equipment.js' worker.js
          grep -q 'lastset-navigation.js' worker.js
          grep -q 'lastset-smartlog-shorthand.js' worker.js
          grep -q 'lastset-core-reliability.js' worker.js
          grep -q 'lastset-smartlog-p1.js' worker.js
          grep -q 'lastset-memory.js' worker.js
          grep -q 'lastset-intelligence.js' worker.js
          grep -q 'lastset-beta.js' worker.js
          grep -q 'lastset-brand.js' worker.js
          grep -q 'lastset-brand.css' worker.js
          grep -q 'lastset-identity.js' worker.js
          grep -q 'lastset-identity.css' worker.js
          grep -q 'lastset-v0140.js' worker.js
          grep -q 'lastset-v0140.css' worker.js
          grep -q 'lastset-onboarding.js' worker.js
          grep -q 'lastset-onboarding.css' worker.js
          grep -q 'lastset-offline.js' worker.js
          grep -q 'lastset-offline.css' worker.js
          grep -q 'lastset-anatomy.js' worker.js
          grep -q 'lastset-anatomy.css' worker.js
          grep -q 'lastset-explore.js' worker.js
          grep -q 'lastset-explore.css' worker.js
          grep -q 'lastset-smartlog-shorthand.js' service-worker.js
          grep -q 'lastset-core-reliability.js' service-worker.js
          grep -q 'lastset-smartlog-p1.js' service-worker.js
          grep -q 'lastset-memory.js' service-worker.js
          grep -q 'lastset-intelligence.js' service-worker.js
          grep -q 'lastset-beta.js' service-worker.js
          grep -q 'lastset-brand.js' service-worker.js
          grep -q 'lastset-brand.css' service-worker.js
          grep -q 'lastset-identity.js' service-worker.js
          grep -q 'lastset-identity.css' service-worker.js
          grep -q 'lastset-v0140.js' service-worker.js
          grep -q 'lastset-v0140.css' service-worker.js
          grep -q 'lastset-onboarding.js' service-worker.js
          grep -q 'lastset-onboarding.css' service-worker.js
          grep -q 'lastset-offline.js' service-worker.js
          grep -q 'lastset-offline.css' service-worker.js
          grep -q 'lastset-anatomy.js' service-worker.js
          grep -q 'lastset-anatomy.css' service-worker.js
          grep -q 'lastset-explore.js' service-worker.js
          grep -q 'lastset-explore.css' service-worker.js
          grep -q 'assets/lastset-mark.svg' service-worker.js
          grep -q 'lastset-smartlog-shorthand.js' build-cloudflare.sh
          grep -q 'lastset-core-reliability.js' build-cloudflare.sh
          grep -q 'lastset-smartlog-p1.js' build-cloudflare.sh
          grep -q 'lastset-memory.js' build-cloudflare.sh
          grep -q 'lastset-intelligence.js' build-cloudflare.sh
          grep -q 'lastset-beta.js' build-cloudflare.sh
          grep -q 'lastset-brand.js' build-cloudflare.sh
          grep -q 'lastset-brand.css' build-cloudflare.sh
          grep -q 'lastset-identity.js' build-cloudflare.sh
          grep -q 'lastset-identity.css' build-cloudflare.sh
          grep -q 'lastset-v0140.js' build-cloudflare.sh
          grep -q 'lastset-v0140.css' build-cloudflare.sh
          grep -q 'lastset-onboarding.js' build-cloudflare.sh
          grep -q 'lastset-onboarding.css' build-cloudflare.sh
          grep -q 'lastset-offline.js' build-cloudflare.sh
          grep -q 'lastset-offline.css' build-cloudflare.sh
          grep -q 'lastset-anatomy.js' build-cloudflare.sh
          grep -q 'lastset-anatomy.css' build-cloudflare.sh
          grep -q 'lastset-explore.js' build-cloudflare.sh
          grep -q 'lastset-explore.css' build-cloudflare.sh
          grep -q 'assets/\*.svg' build-cloudflare.sh
          bash build-cloudflare.sh
          test -s dist/lastset-smartlog-shorthand.js
          test -s dist/lastset-core-reliability.js
          test -s dist/lastset-smartlog-p1.js
          test -s dist/lastset-memory.js
          test -s dist/lastset-intelligence.js
          test -s dist/lastset-beta.js
          test -s dist/lastset-brand.js
          test -s dist/lastset-brand.css
          test -s dist/lastset-identity.js
          test -s dist/lastset-identity.css
          test -s dist/lastset-v0140.js
          test -s dist/lastset-v0140.css
          test -s dist/lastset-onboarding.js
          test -s dist/lastset-onboarding.css
          test -s dist/lastset-offline.js
          test -s dist/lastset-offline.css
          test -s dist/lastset-atlas-regions.js
          test -s dist/lastset-anatomy.js
          test -s dist/lastset-anatomy.css
          test -s dist/assets/anatomy-front.webp
          test -s dist/assets/anatomy-back.webp
          test -s dist/lastset-muscle-library.js
          test -s dist/lastset-explore.js
          test -s dist/lastset-diagnostics.js
          test -s dist/lastset-mobility.js
          test -s dist/lastset-mobility.css
          grep -q 'lastset-mobility.js?v=' dist/index.html
          grep -q 'lastset-explore.js?v=' dist/index.html
          grep -q 'lastset-core-reliability.js?v=' dist/index.html
          grep -q 'lastset-offline.js?v=' dist/index.html
          grep -q 'lastset-anatomy.js?v=' dist/index.html
          test -s dist/lastset-diagnostics.css
          test -s dist/lastset-build.json
          grep -q 'lastset-release' dist/index.html
          grep -q 'RELEASE_ID' dist/service-worker.js
          test -s dist/lastset-explore.css
          test -s dist/assets/lastset-mark.svg
          test -s dist/apple-touch-icon.png
