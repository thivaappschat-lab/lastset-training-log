name: LastSet P2 Verified Production Release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lastset-p2-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: d04b8160bdf0f3df7658ea6c7b2161d7
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      EXPECTED_BUILD: f03ddb07baf78e96bc6a5b583ebb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested app code has not changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only f03ddb07baf78e96bc6a5b583ebb7071ffafa6c2 HEAD)"
          echo "Changed paths since verified candidate artifact:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -vE '^$|^tests/|^docs/P2_REDTEAM_20261012\.md$|^\.github/workflows/' | grep -q .; then
            echo "::error::Application source changed since verified release package."
            exit 1
          fi
      - name: Verify both browser gate runs green at identical source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const https=require('https');
          async function load(id){
            return new Promise((resolve,reject)=>{
              https.get('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+id,{
                headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'LastSet-release-verifier',Accept:'application/vnd.github+json'}
              },res=>{
                let data='';res.on('data',b=>data+=b);res.on('end',()=>{
                  if(res.statusCode!==200)return reject(new Error('Cannot verify run '+id+': HTTP '+res.statusCode));
                  try{resolve(JSON.parse(data))}catch(e){reject(e)}
                });
              }).on('error',reject);
            });
          }
          (async()=>{
            for(const id of [38191528895,38191528901]){
              const run=await load(id);
              if(run.status!=='completed'||run.conclusion!=='success'||run.run_attempt!==1||run.head_sha!=='5fd804d9ff00c07c2e73f192ee2155e3a0cf14d3'){
                throw new Error('Release blocked: run '+id+' is not first-attempt green at expected tested source revision');
              }
              process.stdout.write('Verified green run '+id+'\n');
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify Cloudflare upload credential available
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN (or CF_API_TOKEN). Production unchanged. Set secret and manually dispatch this workflow."
            exit 1
          fi
      - name: Download exact previously validated Cloudflare release package
        uses: actions/download-artifact@v4
        with:
          repository: thivaappschat-lab/lastset-training-log
          run-id: 38191353350
          github-token: ${{ github.token }}
          name: lastset-p2-candidate-f03ddb07baf78e96bc6a5b583ebb7071ffafa6c2
          path: ./release
      - name: Verify SHA256 and build identity before publishing
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c candidate.sha256
          node --check worker.js
          node --check dist/service-worker.js
          node -e "const b=require('./dist/lastset-build.json');if(b.id!==process.env.EXPECTED_BUILD)process.exit(1);"
          test -f dist/assets/anatomy-female-back.webp
          test -f dist/assets/anatomy-male-front.webp
          test -f dist/manifest.webmanifest
          test -f dist/index.html
          echo "Immutable candidate verified: $EXPECTED_BUILD"
      - name: Deploy exact Worker and all static assets to Cloudflare
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify production serves exact candidate and essential static files
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          base="https://lastset-training-log.thiva-claimflow.workers.dev"
          for n in $(seq 1 12); do
            if curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/lastset-build.json" | grep -q "$EXPECTED_BUILD"; then break; fi
            sleep 5
          done
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/lastset-build.json" | grep -q "$EXPECTED_BUILD"
          for asset in index.html lastset-p2.js lastset-p2.css service-worker.js assets/anatomy-female-back.webp assets/anatomy-male-front.webp; do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/$asset?v=$EXPECTED_BUILD" > "/tmp/lastset-$(basename "$asset")"
            case "$asset" in
              index.html) grep -q "lastset-release" "/tmp/lastset-$(basename "$asset")" ;;
              *.js|*.css|*.webp) cmp -s "dist/$asset" "/tmp/lastset-$(basename "$asset")" || { echo "::error::Deployed asset mismatch: $asset"; exit 1; } ;;
            esac
          done
          echo "Verified candidate and production assets match. User localStorage untouched."
