name: LastSet Stage 2 — Live Browser Consent and Erasure
on:
  push:
    branches: [stage2-optin-monitoring-20261014]
    paths: ['.github/workflows/stage2-live-consent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-opt-in:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, mobile-webkit]
    env:
      CI: 'true'
      LASTSET_BASE_URL: https://lastset-training-log.thiva-claimflow.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify production opt-in sends and opt-out erases disposable telemetry
        run: npx playwright test tests/e2e/stage2.telemetry-live.spec.js --project=${{ matrix.project }} --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stage2-live-consent-evidence-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
