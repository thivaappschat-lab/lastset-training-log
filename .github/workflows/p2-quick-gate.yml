name: LastSet P2 Quick Interaction Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2-quick-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      LASTSET_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: bash build-cloudflare.sh
      - name: Start candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/p2-quick.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ | grep -q lastset-release && exit 0; sleep 1; done
          exit 1
      - name: Run small set of high-signal P2 cases
        run: npx playwright test tests/e2e/p2.logging.spec.js --project=mobile-chromium --grep "Today keeps|quick resistance:|quick cardio|mobility quick|Smart Log live" --retries=0 --timeout=12000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-quick-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore
