name: LastSet Approved Evening Release
on:
  push:
    branches: ['feat/evening-quicklog-20261012']
    paths: ['.github/workflows/p2-evening-production-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: lastset-p2-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: d04b8160bdf0f3df7658ea6c7b2161d7
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      TESTED_SHA: b2fcb4176e090183852c81b8a95c0ac9ad781a59
      LASTSET_RELEASE_ID: b2fcb4176e090183852c81b8a95c
      OLD_BUILD: a47fa0cf1ecaf61f9bfd6acf41f8
      OLD_VERSION: 6ff63652-b65c-4e12-b7f0-0f53f7d9ea6f
      BASE: https://lastset-training-log.thiva-claimflow.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce exact tested source, with release workflow only
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TESTED_SHA^{commit}"
          diff="$(git diff --name-only "$TESTED_SHA" HEAD)"
          echo "$diff"
          test "$diff" = ".github/workflows/p2-evening-production-release.yml"
          node --check lastset-p2.js
          node --check worker.js
          test -f wrangler.jsonc
      - name: Verify successful GitHub browser gates and their exact source SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const checks=[
            [38246884241,'fd676f4174958c00e786a16f2acc2b3bb8670d36'],
            [38248527658,'b2fcb4176e090183852c81b8a95c0ac9ad781a59']
          ];
          (async()=>{
            for(const [id,sha] of checks){
              const res=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+id,{
                headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'LastSet-release-gate',Accept:'application/vnd.github+json'}});
              if(!res.ok)throw Error('Cannot check green run '+id+': '+res.status);
              const run=await res.json();
              if(run.status!=='completed'||run.conclusion!=='success'||run.run_attempt!==1||run.head_sha!==sha)
                throw Error('Mismatched or failed tested source: '+id);
              console.log('Verified source and success of run '+id);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Require correct production baseline and configured Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          curl -fsSL --retry 3 --max-time 30 "$BASE/lastset-build.json" | grep -F "$OLD_BUILD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact tested source with deterministic release ID
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          bash build-cloudflare.sh
          node --check dist/service-worker.js
          node -e "const b=require('./dist/lastset-build.json');if(b.id!==process.env.LASTSET_RELEASE_ID)process.exit(1)"
          test -f dist/manifest.webmanifest
          test -f dist/assets/anatomy-female-back.webp
          test -f dist/assets/anatomy-male-front.webp
          sha256sum dist/index.html dist/lastset-p2.js dist/lastset-p2.css dist/service-worker.js worker.js > candidate.sha256
          sha256sum -c candidate.sha256
      - name: Ensure approved artwork and images match prior production, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for art in dist/assets/*; do
            test -f "$art" || continue
            remote="$(mktemp)"
            curl -fsSL --retry 3 --max-time 30 -H 'Cache-Control: no-cache' "$BASE/${art#dist/}?v=$OLD_BUILD" -o "$remote"
            cmp "$art" "$remote" || { echo "::error::Artwork changed unexpectedly: $art"; exit 1; }
            rm -f "$remote"
            count=$((count+1))
          done
          echo "ARTWORK_IDENTICAL=$count"
          test "$count" -ge 5
      - name: Deploy approved LastSet evening candidate
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify new production build and all served release assets
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$BASE/lastset-build.json" | grep -Fq "$LASTSET_RELEASE_ID"; then break; fi
            sleep 5
          done
          curl -fsSL "$BASE/lastset-build.json" | grep -F "$LASTSET_RELEASE_ID"
          matched=0
          while IFS= read -r -d '' file; do
            asset="${file#dist/}"
            case "$asset" in _headers|_redirects) continue;; esac
            remote="$(mktemp)"
            curl -fsSL --retry 3 --max-time 30 -H 'Cache-Control: no-cache' "$BASE/$asset?v=$LASTSET_RELEASE_ID" -o "$remote"
            cmp -s "$file" "$remote" || { echo "::error::Production asset mismatch: $asset"; rm -f "$remote"; exit 1; }
            rm -f "$remote"
            matched=$((matched+1))
          done < <(find dist -type f -print0 | sort -z)
          echo "MATCHING_STATIC_ASSETS=$matched"
          test "$matched" -ge 60
      - name: Roll back only if deployed but verification failed
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"Automatic rollback after LastSet evening release verification failure"}}' "$OLD_VERSION")"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lastset-training-log/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "$payload"
          echo "Attempted rollback to $OLD_VERSION"
